name: Production quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: laureates_test
          POSTGRES_USER: clyvero_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clyvero_test -d laureates_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laureates_test
      DB_USERNAME: clyvero_test
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pdo_pgsql, zip
          coverage: none
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked --no-interaction
      - run: php artisan test --no-ansi

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: https://api.example.test/api/v1
      NEXT_PUBLIC_API_URL: https://api.example.test
      NEXT_PUBLIC_API_HOSTNAME: api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  production-images:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Laravel production image
        run: docker build --file backend/Dockerfile.production --tag clyvero-backend:ci backend
      - name: Build Next.js production image
        run: >-
          docker build --file frontend/Dockerfile.production
          --build-arg NEXT_PUBLIC_API_BASE=https://api.example.test/api/v1
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.test
          --build-arg NEXT_PUBLIC_API_HOSTNAME=api.example.test
          --tag clyvero-frontend:ci frontend
