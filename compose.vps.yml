name: clyvero-vps

x-backend: &backend
  image: clyvero-backend:${IMAGE_TAG:?Set IMAGE_TAG to the deployed commit SHA}
  restart: unless-stopped
  env_file: ${BACKEND_ENV_FILE:-/srv/clyvero/shared/production.env}
  environment:
    AUTORUN_ENABLED: "true"
    AUTORUN_LARAVEL_MIGRATION: "false"
    AUTORUN_LARAVEL_STORAGE_LINK: "false"
  volumes:
    - uploads:/var/www/html/storage/app
  security_opt: ["no-new-privileges:true"]
  logging: &logging
    driver: local
    options:
      max-size: "10m"
      max-file: "5"
  networks: [internal]

services:
  app:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s

  queue:
    <<: *backend
    command: php artisan queue:work redis --sleep=2 --tries=3 --timeout=120 --max-time=3600
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 150s

  scheduler:
    <<: *backend
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    image: clyvero-frontend:${IMAGE_TAG:?Set IMAGE_TAG to the deployed commit SHA}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
